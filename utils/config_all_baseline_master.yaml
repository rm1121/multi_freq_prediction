experiment:
  name: all_baseline_master
  output_dir: ./experiments
  seed: 42

gpu_ids: '0'

training:
  batch_size: 128
  early_stopping_monitor: loss
  early_stopping_patience: 12
  epochs: 60
  learning_rate: 0.001

loss:
  type: focal
  alpha: [2.0, 1.0, 2.0]
  gamma: 2.0
  label_smoothing: 0.0
  cl_weight: 0.0
  cl_temperature: 0.07
  aux_seq_weight: 0.0
  aux_stat_weight: 0.0
  aux_rank_weight: 0.0
  aux_trend_weight: 0.0
  rank_temperature: 0.0
  trend_threshold: 0.05
  aux_decay: false

model:
  # MASTER 基线：使用 4 个指数宏观信息进行市场引导门控
  type: baseline_master
  input_dim: 8
  hidden_dim: 64
  num_layers: 1
  num_classes: 3
  dropout_rate: 0.5
  encoder_type: tcn
  kernel_size: 3
  num_levels: 4
  d_model: 64
  depth: 4
  intra_hidden: 32
  macro_dim: 56

optimizer:
  type: adamw
  lr_scheduler: plateau
  weight_decay: 0.1
  step_size: 30
  gamma: 0.5
  eta_min: 0.000001
  patience: 5
  factor: 0.5

data:
  processed_dir: data/processeddata2_all
  # MASTER 依赖 4 指数宏观输入：SPX / NDQ / DJI / RUT
  use_macro: true
  macro4idx_suffix: ''
